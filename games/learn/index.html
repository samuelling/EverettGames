<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#4361ee">
<title>Everett Learns</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Andika:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1d1b2f;
    --accent: #4361ee;
    --accent2: #4cc9f0;
    --font: "Baloo 2", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
    /* Andika is designed for beginning readers (clear a, g, l, I) */
    --read: "Andika", "Baloo 2", system-ui, sans-serif;
    --u: min(1vmin, 1.78vh, 1vw);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; touch-action: manipulation; overscroll-behavior: none; }
  body {
    font-family: var(--font); color: var(--ink);
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    background: radial-gradient(circle at 20% 10%, rgba(255,255,255,.35) 0 2px, transparent 3px) 0 0 / 40px 40px,
                linear-gradient(160deg, var(--accent2), var(--accent));
  }
  body.read { --accent: #f15bb5; --accent2: #ffd166; }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
  .screen { position: fixed; inset: 0; display: none; }
  .screen.on { display: flex; }

  /* round icon buttons (some must be held) */
  .rb {
    position: relative; width: calc(var(--u) * 9); height: calc(var(--u) * 9); min-width: 44px; min-height: 44px;
    border-radius: 50%; background: #3a3f7a; border: 4px solid var(--ink); box-shadow: 0 4px 0 var(--ink);
    display: grid; place-items: center; flex: none;
  }
  .rb svg.ico { width: 55%; height: 55%; }
  .rb .ring { position: absolute; left: -10px; top: -10px; width: calc(100% + 20px); height: calc(100% + 20px); transform: rotate(-90deg); pointer-events: none; overflow: visible; }
  .rb .ring circle { fill: none; stroke: #ffd23f; stroke-width: 9; stroke-linecap: round; stroke-dasharray: 100; stroke-dashoffset: 100; opacity: 0; }
  .rb.holding .ring circle { opacity: 1; stroke-dashoffset: 0; transition: stroke-dashoffset .8s linear; }
  .rb.yellow { background: #ffd23f; }
  .rb:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }

  .big-btn {
    font-weight: 800; font-size: calc(var(--u) * 9); color: #fff; padding: calc(var(--u) * 1.5) calc(var(--u) * 7);
    border-radius: 999px; border: 5px solid var(--ink); box-shadow: 0 7px 0 var(--ink);
    -webkit-text-stroke: 5px var(--ink); paint-order: stroke fill; display: inline-flex; align-items: center; gap: .3em;
  }
  .big-btn:active { transform: translateY(5px); box-shadow: 0 2px 0 var(--ink); }

  /* ---------- title ---------- */
  #title { flex-direction: column; align-items: center; justify-content: center; gap: calc(var(--u) * 3); }
  #title .top { position: absolute; top: calc(var(--u) * 2.5); left: calc(var(--u) * 2.5); right: calc(var(--u) * 2.5); display: flex; justify-content: space-between; }
  #title h1 { margin: 0; font-size: calc(var(--u) * 19); line-height: 1; display: flex; flex-wrap: wrap; justify-content: center; }
  #title h1 span { display: inline-block; -webkit-text-stroke: 8px var(--ink); paint-order: stroke fill; text-shadow: 0 7px 0 var(--ink); animation: bob 2.2s ease-in-out infinite; }
  #title h1 span:nth-child(odd) { animation-delay: -1.1s; }
  #title h1 .sp { width: .35em; }
  @keyframes bob { 50% { transform: translateY(-6px) rotate(-3deg); } }
  #title .crew { display: flex; gap: calc(var(--u) * 2); align-items: flex-end; }
  #title .crew img { width: calc(var(--u) * 22); animation: hop 1.2s ease-in-out infinite; }
  #title .crew img:nth-child(2) { animation-delay: -.4s; } #title .crew img:nth-child(3) { animation-delay: -.8s; }
  @keyframes hop { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-14%); } }
  #title .row { display: flex; gap: calc(var(--u) * 3); align-items: center; }
  #playBtn { background: #52d273; }
  #stickBtn { background: #ffd23f; font-size: calc(var(--u) * 7); padding: calc(var(--u) * 1.5) calc(var(--u) * 4); }
  #gear { position: absolute; right: calc(var(--u) * 2.5); bottom: calc(var(--u) * 2.5); width: 44px; height: 44px; min-width: 0; min-height: 0; background: rgba(0,0,0,.18); border-width: 0; box-shadow: none; }
  #gear svg { width: 60%; height: 60%; opacity: .5; }

  /* ---------- play ---------- */
  #play { flex-direction: column; }
  .bar { display: flex; align-items: center; gap: calc(var(--u) * 2); padding: calc(var(--u) * 2) calc(var(--u) * 2.5) 0; }
  #jar { flex: 1; display: flex; justify-content: center; gap: calc(var(--u) * 1); }
  #jar i { width: calc(var(--u) * 6); height: calc(var(--u) * 6); display: block; }
  #jar i svg { width: 100%; height: 100%; }
  #jar i.got svg path { fill: #ffd23f; }
  #jar i.got { animation: pop .45s cubic-bezier(.3,1.8,.5,1); }
  @keyframes pop { 0% { transform: scale(.3); } 100% { transform: scale(1); } }
  #scene { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; position: relative; padding: 0 calc(var(--u) * 3); }
  #choices { display: flex; justify-content: center; align-items: center; gap: calc(var(--u) * 3); padding: 0 calc(var(--u) * 2) calc(var(--u) * 3); min-height: calc(var(--u) * 30); flex-wrap: wrap; }
  #helper { position: absolute; left: calc(var(--u) * 1.5); bottom: calc(var(--u) * 1.5); width: calc(var(--u) * 13); pointer-events: none; z-index: 5; transition: transform .2s; }
  #helper.yay { animation: yay .7s ease; } #helper.oops { animation: shake .45s ease; }
  @keyframes yay { 0%, 100% { transform: translateY(0) rotate(0); } 30% { transform: translateY(-40%) rotate(-10deg); } 60% { transform: translateY(-20%) rotate(8deg); } }

  /* choices: shared */
  .ch {
    position: relative; min-width: calc(var(--u) * 20); height: calc(var(--u) * 22); padding: 0 calc(var(--u) * 2.5);
    display: grid; place-items: center; font-weight: 800; font-size: calc(var(--u) * 12); line-height: 1;
    background: #fff; border: 5px solid var(--ink); border-radius: calc(var(--u) * 5); box-shadow: 0 7px 0 var(--ink);
    transition: transform .12s;
  }
  .ch:active { transform: translateY(4px); }
  .ch .lbl { -webkit-text-stroke: 0; }
  .ch.k-word, .ch.k-label { font-family: var(--read); font-weight: 700; font-size: calc(var(--u) * 8); min-width: calc(var(--u) * 26); }
  body.read .ch.k-letter { font-family: var(--read); font-weight: 700; }
  .ch.k-word.long { font-size: calc(var(--u) * 5.2); }
  .ch.k-pic { font-size: calc(var(--u) * 14); width: calc(var(--u) * 26); }
  .ch.k-shape, .ch.k-share { width: calc(var(--u) * 24); padding: calc(var(--u) * 2); }
  .ch.k-shape svg, .ch.k-share svg { width: 100%; height: 100%; }
  .ch.k-claps { font-size: calc(var(--u) * 6); min-width: calc(var(--u) * 16); padding: 0 calc(var(--u) * 1.5); }
  .ch.k-frac { font-size: calc(var(--u) * 7); }
  .frac { display: inline-flex; flex-direction: column; align-items: center; line-height: 1; }
  .frac b { border-top: 5px solid var(--ink); width: 100%; text-align: center; padding-top: 2px; }
  .ch.wrong { opacity: .35; animation: shake .45s ease; pointer-events: none; }
  @keyframes shake { 20%, 60% { transform: translateX(-10px) rotate(-3deg); } 40%, 80% { transform: translateX(10px) rotate(3deg); } }
  .ch.right { background: #b7f7c4; animation: win .6s cubic-bezier(.3,1.7,.5,1); }
  @keyframes win { 0% { transform: scale(1); } 40% { transform: scale(1.2) rotate(-4deg); } 100% { transform: scale(1.06); } }
  .ch.reveal { animation: glow 1s ease-in-out infinite; }
  @keyframes glow { 50% { box-shadow: 0 7px 0 var(--ink), 0 0 0 10px #ffd23f, 0 0 40px 14px #ffd23f; transform: scale(1.08); } }

  /* balloon style */
  .st-balloon .ch {
    border-radius: 50% 50% 48% 48% / 55% 55% 45% 45%; width: calc(var(--u) * 21); height: calc(var(--u) * 25); min-width: 0; padding: 0;
    color: #fff; -webkit-text-stroke: 5px var(--ink); paint-order: stroke fill; box-shadow: inset -10px -14px 0 rgba(0,0,0,.15), inset 8px 8px 0 rgba(255,255,255,.35);
    animation: float 2.6s ease-in-out infinite; margin-bottom: calc(var(--u) * 6);
  }
  .st-balloon .ch.k-word { width: auto; min-width: calc(var(--u) * 24); padding: 0 calc(var(--u) * 3); border-radius: 45% / 50%; }
  .st-balloon .ch::after { content: ""; position: absolute; left: 50%; top: 100%; width: 3px; height: calc(var(--u) * 7); background: var(--ink); transform: translateX(-50%); }
  .st-balloon .ch::before { content: ""; position: absolute; left: 50%; top: calc(100% - 4px); border: 8px solid transparent; border-bottom-color: var(--ink); transform: translateX(-50%) rotate(180deg); }
  .st-balloon .ch:nth-child(1) { background: #ff4d6d; } .st-balloon .ch:nth-child(2) { background: #4cc9f0; animation-delay: -.7s; }
  .st-balloon .ch:nth-child(3) { background: #52d273; animation-delay: -1.4s; } .st-balloon .ch:nth-child(4) { background: #c77dff; animation-delay: -2s; }
  .st-balloon .ch.right { animation: popballoon .35s ease-out forwards; }
  @keyframes float { 50% { transform: translateY(-12px) rotate(2deg); } }
  @keyframes popballoon { 0% { transform: scale(1); } 60% { transform: scale(1.35); opacity: 1; } 100% { transform: scale(1.6); opacity: 0; } }
  /* cookie style */
  .st-cookie .ch {
    border-radius: 50%; width: calc(var(--u) * 22); min-width: 0; padding: 0; background: radial-gradient(circle at 30% 30%, #f6c77b, #d9963f);
    font-family: var(--font);
  }
  .st-cookie .ch::before { content: ""; position: absolute; inset: 14%; background:
    radial-gradient(circle, #5b3a1e 0 5px, transparent 6px) 10% 20% / 40% 40% no-repeat,
    radial-gradient(circle, #5b3a1e 0 5px, transparent 6px) 80% 15% / 40% 40% no-repeat,
    radial-gradient(circle, #5b3a1e 0 5px, transparent 6px) 20% 90% / 40% 40% no-repeat,
    radial-gradient(circle, #5b3a1e 0 5px, transparent 6px) 90% 85% / 40% 40% no-repeat; pointer-events: none; }
  .st-cookie .ch .lbl { color: #fff; -webkit-text-stroke: 5px var(--ink); paint-order: stroke fill; position: relative; }
  .st-cookie .ch.right { animation: chomp .7s steps(3) forwards; }
  @keyframes chomp { 0% { clip-path: circle(70% at 50% 50%); } 33% { clip-path: polygon(0 0, 100% 0, 100% 30%, 75% 45%, 100% 60%, 100% 100%, 0 100%); } 66% { clip-path: polygon(0 0, 60% 0, 45% 30%, 60% 50%, 40% 75%, 55% 100%, 0 100%); } 100% { clip-path: circle(0 at 50% 50%); } }
  /* card + stone + bubble */
  .st-card .ch { border-radius: calc(var(--u) * 3); background: #fffdf3; }
  .st-card .ch.right { animation: flipwin .6s ease; }
  @keyframes flipwin { 50% { transform: rotateY(180deg) scale(1.15); } }
  .st-stone .ch { border-radius: 46% 54% 50% 50% / 60% 60% 40% 40%; background: #c9c3b6; }
  .st-bubble .ch { border-radius: 999px; background: #fff; }

  /* ---------- scene pieces ---------- */
  .bud { display: block; width: var(--bw, calc(var(--u) * 11)); transition: transform .15s; }
  .bud.counted { filter: drop-shadow(0 0 0 #fff) drop-shadow(0 0 6px #ffd23f); }
  .bud.lit { transform: scale(1.25) translateY(-8%); filter: drop-shadow(0 0 10px #fff); }
  .bud.away { opacity: .35; transform: translateY(-30%) rotate(-12deg); }
  .budwrap { position: relative; }
  .badge { position: absolute; right: -4%; top: -6%; background: #ffd23f; border: 3px solid var(--ink); border-radius: 999px; font-weight: 800; min-width: 1.6em; text-align: center; font-size: calc(var(--u) * 3.6); line-height: 1.3; padding: 0 .2em; }
  .rows { display: flex; flex-direction: column; gap: calc(var(--u) * 1); align-items: center; }
  .row { display: flex; gap: calc(var(--u) * 1); }
  .groupbox { background: rgba(255,255,255,.35); border: 4px solid var(--ink); border-radius: calc(var(--u) * 4); padding: calc(var(--u) * 2); display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 1); }
  .numtag { font-weight: 800; font-size: calc(var(--u) * 7); color: #fff; -webkit-text-stroke: 5px var(--ink); paint-order: stroke fill; line-height: 1; }
  .op { font-weight: 800; font-size: calc(var(--u) * 12); color: #fff; -webkit-text-stroke: 6px var(--ink); paint-order: stroke fill; margin: 0 calc(var(--u) * 2); }
  .eqn { font-weight: 800; font-size: calc(var(--u) * 15); color: #fff; -webkit-text-stroke: 8px var(--ink); paint-order: stroke fill; white-space: nowrap; }
  .bigtext { font-family: var(--read); font-weight: 700; font-size: calc(var(--u) * 20); background: #fff; border: 6px solid var(--ink); border-radius: calc(var(--u) * 4); padding: 0 calc(var(--u) * 5); box-shadow: 0 8px 0 var(--ink); line-height: 1.3; }
  .picbox { display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 1); }
  .picbox .em { font-size: calc(var(--u) * 26); line-height: 1.05; filter: drop-shadow(0 6px 0 rgba(0,0,0,.18)); cursor: pointer; }
  .picbox .gap { font-family: var(--read); font-weight: 700; font-size: calc(var(--u) * 11); background: #fff; border: 5px solid var(--ink); border-radius: 20px; padding: 0 .5em; letter-spacing: .1em; }
  .sentence, .story { font-family: var(--read); background: #fff; border: 5px solid var(--ink); border-radius: calc(var(--u) * 3); box-shadow: 0 7px 0 var(--ink); padding: calc(var(--u) * 2) calc(var(--u) * 4); max-width: 88%; }
  .sentence { font-size: calc(var(--u) * 8); line-height: 1.3; }
  .sentence u { display: inline-block; min-width: 3em; border-bottom: 5px solid var(--ink); text-decoration: none; }
  .story { font-size: calc(var(--u) * 4.4); line-height: 1.45; }
  .story p { margin: 0 0 .5em; } .story .q { font-weight: 700; color: #c9184a; margin: 0; }
  .ten { display: grid; grid-template-columns: repeat(5, calc(var(--u) * 13)); grid-auto-rows: calc(var(--u) * 13); gap: 0; border: 5px solid var(--ink); background: #fff; border-radius: 10px; }
  .ten > div { border: 2px solid #9aa0c8; display: grid; place-items: center; }
  .ten > div.empty.lit { background: #ffe58a; }
  .ten img { width: 92%; }
  .path { display: flex; align-items: flex-end; gap: calc(var(--u) * 2); }
  .stone { width: calc(var(--u) * 17); height: calc(var(--u) * 13); background: #c9c3b6; border: 5px solid var(--ink); border-radius: 46% 54% 50% 50% / 60% 60% 40% 40%; display: grid; place-items: center; font-weight: 800; font-size: calc(var(--u) * 8); position: relative; box-shadow: 0 6px 0 var(--ink); }
  .stone.q { background: #ffe58a; animation: glow2 1.2s ease-in-out infinite; }
  .stone.lit { background: #ffe58a; transform: translateY(-6px); }
  .stone img { position: absolute; bottom: 70%; width: 80%; }
  @keyframes glow2 { 50% { transform: translateY(-6px); } }
  .place { display: flex; gap: calc(var(--u) * 1.6); align-items: flex-end; flex-wrap: wrap; justify-content: center; max-width: 96%; }
  .flat { display: grid; grid-template-columns: repeat(10, calc(var(--u) * 1.7)); grid-auto-rows: calc(var(--u) * 1.7); border: 3px solid var(--ink); background: #ffb347; }
  .flat i { border: 1px solid rgba(0,0,0,.25); }
  .rod { display: grid; grid-template-rows: repeat(10, calc(var(--u) * 3.8)); width: calc(var(--u) * 4); border: 3px solid var(--ink); background: #4cc9f0; }
  .rod i, .cube { border: 1px solid rgba(0,0,0,.3); }
  .cube { width: calc(var(--u) * 4); height: calc(var(--u) * 4); border: 3px solid var(--ink); background: #52d273; }
  .ones { display: grid; grid-template-columns: repeat(3, auto); gap: 4px; }
  .lit2 { outline: 5px solid #ffd23f; outline-offset: 3px; }
  .mascot { width: calc(var(--u) * 30); animation: hop 1.4s ease-in-out infinite; }
  svg.vis { width: calc(var(--u) * 46); height: calc(var(--u) * 46); }

  /* spelling tiles */
  .slots { display: flex; gap: calc(var(--u) * 1.5); margin-top: calc(var(--u) * 2); }
  .slot { width: calc(var(--u) * 13); height: calc(var(--u) * 15); border: 5px dashed var(--ink); border-radius: 16px; background: rgba(255,255,255,.4); display: grid; place-items: center; font-family: var(--read); font-weight: 700; font-size: calc(var(--u) * 11); }
  .slot.filled { border-style: solid; background: #fff; animation: pop .35s cubic-bezier(.3,1.8,.5,1); }
  .tile { width: calc(var(--u) * 15); height: calc(var(--u) * 17); min-width: 0; font-family: var(--read); font-weight: 700; font-size: calc(var(--u) * 11); background: #ffd23f; padding: 0; }
  .tile.used { visibility: hidden; }

  /* confetti */
  .conf { position: fixed; width: 10px; height: 14px; z-index: 50; pointer-events: none; border-radius: 2px; }
  .flystar { position: fixed; z-index: 60; width: 60px; height: 60px; pointer-events: none; }

  /* ---------- reward / stickers / parent ---------- */
  #reward, #stickers { flex-direction: column; align-items: center; justify-content: center; gap: calc(var(--u) * 3); }
  #reward h2, #stickers h2 { margin: 0; font-size: calc(var(--u) * 11); color: #fff; -webkit-text-stroke: 8px var(--ink); paint-order: stroke fill; }
  .gift { width: calc(var(--u) * 34); height: calc(var(--u) * 34); position: relative; display: grid; place-items: center; }
  .gift .box { font-size: calc(var(--u) * 28); animation: wiggle .5s ease-in-out infinite; }
  .gift img { width: 100%; display: none; }
  .gift.open .box { display: none; } .gift.open img { display: block; animation: reveal .8s cubic-bezier(.3,1.7,.5,1); }
  @keyframes wiggle { 25% { transform: rotate(-8deg); } 75% { transform: rotate(8deg); } }
  @keyframes reveal { 0% { transform: scale(0) rotate(-30deg); } 100% { transform: scale(1) rotate(0); } }
  #reward .row, #stickers .row { display: flex; gap: calc(var(--u) * 3); align-items: center; }
  #again { background: #52d273; }
  .book { display: grid; grid-template-columns: repeat(7, calc(var(--u) * 15)); gap: calc(var(--u) * 2); background: rgba(255,255,255,.3); border: 5px solid var(--ink); border-radius: calc(var(--u) * 4); padding: calc(var(--u) * 2.5); }
  .book button { width: 100%; aspect-ratio: 1; background: #fff; border: 4px solid var(--ink); border-radius: 20px; display: grid; place-items: center; }
  .book img { width: 90%; }
  .book .gold { position: absolute; }
  #parent { flex-direction: column; overflow: auto; background: #f4f4fb; padding: 18px 22px; font-family: system-ui, sans-serif; font-size: 15px; display: none; }
  #parent.on { display: block; }
  #parent h3 { margin: 4px 0 8px; font-family: var(--font); font-size: 24px; }
  #parent table { border-collapse: collapse; margin: 8px 0 14px; }
  #parent td, #parent th { border-bottom: 1px solid #ccd; padding: 4px 10px; text-align: left; }
  #parent .pbtn { background: #fff; border: 2px solid #334; border-radius: 8px; padding: 6px 12px; margin: 0 6px 6px 0; font-family: system-ui; font-size: 14px; }
  #parent .pbtn.on { background: #334; color: #fff; }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: .01s !important; } }
</style>
</head>
<body>
<section id="title" class="screen">
  <div class="top">
    <button class="rb hold" id="homeT" aria-label="Back to the console (hold)"></button>
    <button class="rb hold" id="muteT" aria-label="Sound (hold)"></button>
  </div>
  <h1 id="logo"></h1>
  <div class="crew" id="crew"></div>
  <div class="row">
    <button class="big-btn" id="playBtn">▶ Play</button>
    <button class="big-btn" id="stickBtn" aria-label="Sticker book">⭐</button>
  </div>
  <button class="rb hold" id="gear" aria-label="Grown-ups (hold)"><svg class="ico" viewBox="0 0 24 24"><path fill="#fff" d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3h-4l-.4 2.9a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.4 7.4 0 0 0 1.7 1L11 21h4l.4-2.9a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5A3.5 3.5 0 1 1 16.5 12 3.5 3.5 0 0 1 13 15.5z"/></svg></button>
</section>

<section id="play" class="screen">
  <div class="bar">
    <button class="rb hold" id="homeP" aria-label="Stop (hold)"></button>
    <div id="jar"></div>
    <button class="rb yellow" id="sayBtn" aria-label="Say it again"></button>
    <button class="rb hold" id="muteP" aria-label="Sound (hold)"></button>
  </div>
  <div id="scene"></div>
  <div id="choices"></div>
  <img id="helper" alt="">
</section>

<section id="reward" class="screen">
  <h2 id="rewardTitle">YOU DID IT!</h2>
  <div class="gift" id="gift"><div class="box">🎁</div><img id="giftImg" alt=""></div>
  <div class="row">
    <button class="big-btn" id="again">▶ Again</button>
    <button class="big-btn" id="toBook" style="background:#ffd23f">⭐</button>
