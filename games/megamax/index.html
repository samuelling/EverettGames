<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#120c24">
<title>MegaMax — an Everett Game</title>
<style>
  html, body { margin: 0; height: 100%; background: #120c24; overflow: hidden; touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; border-radius: 6px; }
</style>
</head>
<body>
<canvas id="game" aria-label="MegaMax game"></canvas>
<script>
  // no pinch / double-tap zoom (iPad Safari ignores user-scalable=no)
  ['gesturestart', 'gesturechange', 'gestureend', 'dblclick'].forEach(function (t) {
    document.addEventListener(t, function (e) { if (e.cancelable) e.preventDefault(); }, { passive: false });
  });
</script>
<script src="audio.js"></script>
<script src="art.js"></script>
<script src="game.js"></script>
</body>
</html>
